<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Maprang 💖</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Itim&display=swap"
        rel="stylesheet"
    >

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family: 'Itim', cursive !important;
        }

        html,
        body{
            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        body{

            background: #111;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* พื้นที่หลัก */

        .screen{

            width: 1920px;
            height: 1080px;

            max-width: 100vw;
            max-height: 100vh;

            overflow: hidden;

            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #ff9a9e 0%,
                    #fecfef 100%
                );
        }

        /* กล่อง */

        .container{

            position: relative;
            z-index: 10;

            width: 90%;
            max-width: 420px;

            padding: 30px;

            border-radius: 30px;

            text-align: center;

            background:
                rgba(255,255,255,0.88);

            backdrop-filter: blur(8px);

            box-shadow:
                0 15px 35px rgba(0,0,0,0.15);
        }

        /* รูป */

        .photo-frame{

            width: 220px;
            height: 220px;

            margin: 0 auto 20px;

            border-radius: 22px;

            overflow: hidden;

            border: 6px solid white;

            background: #eee;

            box-shadow:
                0 8px 20px rgba(0,0,0,0.12);
        }

        .photo-frame img{

            width: 100%;
            height: 100%;

            object-fit: cover;

            transition: opacity 0.3s ease;
        }

        /* ข้อความ */

        h1{

            margin: 10px 0;

            font-size: 2.2rem;

            color: #d63384;
        }

        p{

            margin-bottom: 10px;

            color: #666;

            font-size: 1.15rem;
        }

        #love-message{

            margin-top: 15px;

            min-height: 40px;

            font-size: 1.3rem;
            font-weight: bold;

            color: #d63384;
        }

        /* ปุ่ม */

        .button-group{

            display: flex;
            flex-direction: column;

            gap: 12px;

            margin-top: 20px;
        }

        .btn{

            width: 100%;

            border: none;

            border-radius: 50px;

            padding: 13px 20px;

            color: white;

            font-size: 1.2rem;

            cursor: pointer;

            transition:
                transform 0.2s,
                background 0.2s;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.1);
        }

        .btn:hover{
            transform: scale(1.04);
        }

        .btn-love{
            background: #ff4757;
        }

        .btn-love:hover{
            background: #ff6b81;
        }

        .btn-change{
            background: #ffa502;
        }

        .btn-change:hover{
            background: #ffb733;
        }

        /* ปุ่มหนี */

        #runaway-btn{

            background: #95a5a6;

            position: relative;

            left: auto;
            top: auto;
        }

        #runaway-btn.runaway-mode{

            position: absolute;

            z-index: 9999;

            width: auto;
            min-width: 120px;

            transition:
                left 0.15s ease,
                top 0.15s ease;
        }

        /* หัวใจ */

        .heart-fall{

            position: absolute;

            top: -10%;

            font-size: 24px;

            pointer-events: none;

            animation: fall linear forwards;

            z-index: 1;
        }

        @keyframes fall{

            to{

                transform:
                    translateY(120vh)
                    rotate(360deg);
            }
        }

        /* POPUP */

        .popup-overlay{

            position: absolute;

            inset: 0;

            background:
                rgba(0,0,0,0.45);

            backdrop-filter: blur(5px);

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 99999;

            opacity: 0;

            pointer-events: none;

            transition: 0.3s;
        }

        .popup-overlay.show{

            opacity: 1;

            pointer-events: auto;
        }

        .popup-box{

            width: 90%;
            max-width: 420px;

            background: white;

            border-radius: 28px;

            padding: 35px 25px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.2);

            animation:
                popupShow 0.35s ease;
        }

        .popup-box h2{

            color: #ff4d88;

            font-size: 2rem;

            margin-bottom: 12px;
        }

        .popup-box p{

            color: #666;

            font-size: 1.2rem;

            line-height: 1.7;
        }

        .popup-btn{

            margin-top: 22px;

            border: none;

            background: #ff4d88;

            color: white;

            padding: 12px 28px;

            border-radius: 50px;

            font-size: 1.1rem;

            cursor: pointer;

            transition: 0.2s;
        }

        .popup-btn:hover{

            transform: scale(1.05);

            background: #ff6aa0;
        }

        @keyframes popupShow{

            from{

                transform:
                    scale(0.7)
                    translateY(20px);

                opacity: 0;
            }

            to{

                transform:
                    scale(1)
                    translateY(0);

                opacity: 1;
            }
        }

        /* Responsive */

        @media (max-width: 600px){

            .photo-frame{

                width: 180px;
                height: 180px;
            }

            h1{
                font-size: 1.8rem;
            }

            .btn{
                font-size: 1rem;
            }

            #love-message{
                font-size: 1.1rem;
            }
        }

    </style>
</head>

<body>

    <div class="screen" id="screen">

        <div class="container">

            <div class="photo-frame">

                <img
                    id="main-photo"
                    src="image.jpg"
                    alt="Maprang"
                >

            </div>

            <h1>
                ถึง...อ้วนปรางคนเก่ง 💖
            </h1>

            <p>
                ยินดีที่ได้มีเธออยู่ในชีวิตนะ ❤️
            </p>

            <div id="love-message">
                ลองกดปุ่มดูสิคะ ✨
            </div>

            <div class="button-group">

                <button
                    class="btn btn-love"
                    onclick="showSurprise()"
                >
                    รักที่สุด! 💘
                </button>

                <button
                    class="btn btn-change"
                    onclick="changePhoto()"
                >
                    เปลี่ยนรูปภาพ ✨
                </button>

                <button
                    id="runaway-btn"
                    class="btn"
                >
                    ไม่รัก / ปิด 😾
                </button>

            </div>

        </div>

        <!-- POPUP -->

        <div
            class="popup-overlay"
            id="love-popup"
        >

            <div class="popup-box">

                <h2>
                    💖 ถึงอ้วนปราง 💖
                </h2>

                <p>
                    ไม่รักก็ไม่เป็นไรนะ 🥺<br><br>
                    แต่เค้ารักอ้วนปรางที่สุดเลย 💕
                </p>

                <button
                    class="popup-btn"
                    onclick="closePopup()"
                >
                    เค้ารู้แล้ว 💘
                </button>

            </div>

        </div>

    </div>

    <script>

        // รูปภาพ

        const myPhotos = [
            "image.jpg",
            "image2.png"
        ];

        let currentPhotoIndex = 0;

        // ปุ่มหนี

        let runawayCount = 0;

        const maxRunaway = 5;

        let isRunawayMode = false;

        let originalParent = null;
        let originalNextSibling = null;

        // เปลี่ยนรูป

        function changePhoto(){

            currentPhotoIndex =
                (currentPhotoIndex + 1)
                % myPhotos.length;

            const img =
                document.getElementById(
                    "main-photo"
                );

            img.style.opacity = 0;

            setTimeout(() => {

                img.src =
                    myPhotos[currentPhotoIndex];

                img.style.opacity = 1;

            }, 300);
        }

        // รีเซ็ตปุ่ม

        function resetButtonPosition(){

            const btn =
                document.getElementById(
                    "runaway-btn"
                );

            if(
                isRunawayMode &&
                originalParent
            ){

                btn.classList.remove(
                    "runaway-mode"
                );

                if(originalNextSibling){

                    originalParent.insertBefore(
                        btn,
                        originalNextSibling
                    );

                }else{

                    originalParent.appendChild(
                        btn
                    );
                }

                btn.style.position = "";
                btn.style.left = "";
                btn.style.top = "";

                isRunawayMode = false;
            }
        }

        // เปิด popup

        function showPopup(){

            document
                .getElementById(
                    "love-popup"
                )
                .classList.add(
                    "show"
                );
        }

        // ปิด popup

        function closePopup(){

            document
                .getElementById(
                    "love-popup"
                )
                .classList.remove(
                    "show"
                );
        }

        // ปุ่มหนี

        function moveButton(){

            if(
                runawayCount >= maxRunaway
            ){
                return;
            }

            const btn =
                document.getElementById(
                    "runaway-btn"
                );

            const screen =
                document.getElementById(
                    "screen"
                );

            // เริ่มโหมดหนี

            if(!isRunawayMode){

                originalParent =
                    btn.parentNode;

                originalNextSibling =
                    btn.nextSibling;

                btn.classList.add(
                    "runaway-mode"
                );

                screen.appendChild(btn);

                isRunawayMode = true;
            }

            const screenRect =
                screen.getBoundingClientRect();

            const btnRect =
                btn.getBoundingClientRect();

            const padding = 15;

            const maxX =
                screenRect.width
                - btnRect.width
                - padding;

            const maxY =
                screenRect.height
                - btnRect.height
                - padding;

            const minX = padding;
            const minY = padding;

            let randomX =
                Math.random()
                * (maxX - minX)
                + minX;

            let randomY =
                Math.random()
                * (maxY - minY)
                + minY;

            randomX =
                Math.max(
                    minX,
                    Math.min(maxX, randomX)
                );

            randomY =
                Math.max(
                    minY,
                    Math.min(maxY, randomY)
                );

            btn.style.left =
                randomX + "px";

            btn.style.top =
                randomY + "px";

            runawayCount++;

            document
                .getElementById(
                    "love-message"
                )
                .innerText =
                `ไม่ให้ปิด 😝 (${runawayCount}/${maxRunaway})`;

            // ครบ 5 ครั้ง

            if(
                runawayCount >= maxRunaway
            ){

                setTimeout(() => {

                    resetButtonPosition();

                    btn.innerText =
                        "โอเค ยอมแล้ว 🥺";

                    document
                        .getElementById(
                            "love-message"
                        )
                        .innerText =
                            "จับได้แล้วว 💖";

                    // เปิด popup

                    showPopup();

                }, 300);
            }
        }

        // คลิกปุ่ม

        function handleRunawayClick(event){

            event.stopPropagation();

            if(
                runawayCount
                < maxRunaway
            ){

                moveButton();

            }else{

                document
                    .getElementById(
                        "love-message"
                    )
                    .innerText =
                    "ก็ได้... แต่ต้องคิดถึงกันนะ 💕";
            }
        }

        // สร้างหัวใจ

        function createHeart(){

            const heart =
                document.createElement(
                    "div"
                );

            heart.classList.add(
                "heart-fall"
            );

            const icons = [
                "❤️",
                "💖",
                "💕",
                "✨",
                "🌸",
                "🌷"
            ];

            heart.innerHTML =
                icons[
                    Math.floor(
                        Math.random()
                        * icons.length
                    )
                ];

            heart.style.left =
                Math.random() * 100
                + "%";

            heart.style.animationDuration =
                Math.random() * 3 + 2
                + "s";

            heart.style.opacity =
                Math.random() * 0.7 + 0.3;

            document
                .getElementById(
                    "screen"
                )
                .appendChild(
                    heart
                );

            setTimeout(() => {

                heart.remove();

            }, 5000);
        }

        // ข้อความสุ่ม

        const messages = [

            "รักอ้วนนะ ขอบคุณที่เข้ามาในชีวิต 💖",

            "วันนี้อ้วนเหนื่อยไหม? สู้ๆ นะ 🌸",

            "อ้วนคือคนสำคัญที่สุดของเค้า 💕",

            "อ้วนน่ารักที่สุดในโลก ✨",

            "เค้าภูมิใจในตัวอ้วนนะ 🌷",

            "อยู่ด้วยกันไปนานๆ น้า ☁️"
        ];

        // ปุ่มรัก

        function showSurprise(){

            const randomMsg =

                messages[
                    Math.floor(
                        Math.random()
                        * messages.length
                    )
                ];

            document
                .getElementById(
                    "love-message"
                )
                .innerText =
                    randomMsg;

            for(
                let i = 0;
                i < 30;
                i++
            ){

                setTimeout(
                    createHeart,
                    i * 80
                );
            }

            if(isRunawayMode){

                resetButtonPosition();
            }
        }

        // Event ปุ่มหนี

        const runawayBtn =
            document.getElementById(
                "runaway-btn"
            );

        // เอาเมาส์ไปโดน = หนี

        runawayBtn.addEventListener(
            "mouseenter",
            () => {

                if(
                    runawayCount
                    < maxRunaway
                ){

                    moveButton();
                }
            }
        );

        // คลิก = หนี

        runawayBtn.addEventListener(
            "click",
            (event) => {

                handleRunawayClick(
                    event
                );
            }
        );

        // หัวใจตก

        setInterval(
            createHeart,
            900
        );

    </script>

</body>
</html>
